name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: PHP 8.4 / ${{ matrix.os }} / framework ${{ matrix.framework }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        framework: [v0.6.1, main]
    defaults:
      run:
        working-directory: openapi
    steps:
      - uses: actions/checkout@v4
        with:
          path: openapi
      # The path repository exercises both the release and current development API.
      - uses: actions/checkout@v4
        with:
          repository: crabphp/framework
          ref: ${{ matrix.framework }}
          path: framework
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pcntl, posix, sockets, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer validate --strict
      - run: composer format:check
      - run: composer lint
      - run: composer test
