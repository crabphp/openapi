name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: openapi
    steps:
      - uses: actions/checkout@v4
        with:
          path: openapi
      # Tested against the framework's main, which composer.json reads from ../framework; a release requires ^0.6 of it.
      - uses: actions/checkout@v4
        with:
          repository: crabphp/framework
          path: framework
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pcntl, posix, sockets, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer format:check
      - run: composer lint
      - run: vendor/bin/phpunit
